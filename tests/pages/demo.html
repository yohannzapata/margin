<!doctype html>
<html><head><meta charset="utf-8"><title>Margin demo: New message</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #eef1f5; font: 15px "Segoe UI", system-ui, sans-serif; color: #1a1a1a; }
  .window { width: 680px; margin: 28px auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.12); overflow: hidden; }
  .bar { padding: 12px 18px; background: #f7f8fa; border-bottom: 1px solid #e3e6ea; font-weight: 600; font-size: 14px; color: #3b3f45; }
  .row { display: flex; padding: 10px 18px; border-bottom: 1px solid #eef0f2; font-size: 14px; }
  .row span:first-child { width: 70px; color: #6b7078; }
  #body { min-height: 230px; padding: 16px 18px; line-height: 1.6; outline: none; }
  .foot { padding: 12px 18px; border-top: 1px solid #eef0f2; }
  .send { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 7px 18px; font: inherit; font-weight: 600; }
</style></head><body>
<div class="window">
  <div class="bar">New message</div>
  <div class="row"><span>To</span><span>sarah.lee@example.com</span></div>
  <div class="row"><span>Subject</span><span>Quarterly report</span></div>
  <div id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message body"></div>
  <div class="foot"><button class="send" tabindex="-1">Send</button></div>
</div>
<script>window.addEventListener("load", () => document.getElementById("body").focus());</script>
</body></html>
